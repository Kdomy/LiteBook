name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'vx.y.z'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || { echo "Gradle build failed"; exit 1; }
          ls -R app/build/outputs/apk || echo "No APK directory found"

      - name: Prepare Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystores"
          RAW="$RUNNER_TEMP/keystores/keystore.raw"
          JKS="$RUNNER_TEMP/keystores/keystore.jks"
          KEYTOOL="$JAVA_HOME/bin/keytool"

          # Normalise the secret: drop whitespace/CR and any "data:...;base64," prefix
          printf '%s' "$KEYSTORE_B64" \
            | tr -d ' \t\r\n' \
            | sed 's/^data:[^,]*,//' \
            | base64 --decode > "$RAW"

          SIZE=$(stat -c%s "$RAW")
          echo "Decoded keystore size: ${SIZE} bytes"
          echo "First bytes: $(od -An -tx1 -N8 "$RAW" | tr -d ' \n')"
          if [ "$SIZE" -lt 64 ]; then
            echo "::error::KEYSTORE_FILE did not decode to a keystore (size ${SIZE}). Store it as a clean single-line base64 string, without any data: prefix."
            exit 1
          fi

          if ! "$KEYTOOL" -list -keystore "$RAW" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Cannot open the decoded keystore with KEYSTORE_PASSWORD. Check KEYSTORE_FILE and KEYSTORE_PASSWORD."
            exit 1
          fi

          ALIASES=$("$KEYTOOL" -list -keystore "$RAW" -storepass "$KEYSTORE_PASSWORD" \
            | sed -n 's/^\([^,]*\),.*/\1/p' | sed 's/[[:space:]]*$//')
          FOUND_ALIAS=$(printf '%s\n' "$ALIASES" | grep -Fix "$KEY_ALIAS" | head -n 1 || true)
          if [ -z "$FOUND_ALIAS" ]; then
            echo "::error::Alias '$KEY_ALIAS' not found in keystore. Available aliases: $ALIASES"
            exit 1
          fi
          echo "Using alias: $FOUND_ALIAS"

          # Re-export as classic JKS: broadest apksigner compatibility, same key/cert
          "$KEYTOOL" -importkeystore \
            -srckeystore "$RAW" \
            -destkeystore "$JKS" \
            -deststoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$FOUND_ALIAS" \
            -destalias "$FOUND_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -noprompt

          "$KEYTOOL" -list -keystore "$JKS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Keystore ready (JKS)."

      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          IN_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_APK="app-release.apk"

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found at $APKSIGNER"
            exit 1
          fi
          if [ ! -f "$IN_APK" ]; then
            echo "::error::APK not found at $IN_APK"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/keystores/keystore.jks" \
            --ks-type JKS \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            "$IN_APK"

          echo "=== Signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$IN_APK" \
            | grep -Ei "Verified using|Number of signers|Signer #1 certificate DN|Signer #1 certificate SHA-256"

          cp "$IN_APK" "$OUT_APK"
          echo "Signed APK: $OUT_APK ($(stat -c%s "$OUT_APK") bytes)"

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keystores"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: app-release.apk
          compression-level: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Tag for Manual Trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on origin, reusing it."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-artifact

      - name: Rename APK for Release
        run: |
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name }}"
          mv app-release.apk "LiteBook_${TAG_NAME}.apk"
          if [ ! -f "LiteBook_${TAG_NAME}.apk" ]; then
            echo "Failed to rename APK"
            exit 1
          fi

      - name: Prepare Changelog
        run: |
          if [ ! -f CHANGE.md ]; then
            echo "CHANGE.md not found, using default changelog"
            echo "Release ${{ github.ref_name || github.event.inputs.release_tag }}" > CHANGE.txt
          else
            cp CHANGE.md CHANGE.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: LiteBook_${{ github.event.inputs.release_tag || github.ref_name }}.apk
          body_path: CHANGE.txt
